<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}K-Means Clustering{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand" href="/">⬡ K-Means</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-1">
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="/">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'descripcion' %}active{% endif %}" href="/descripcion/">Descripción</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'dataset' %}active{% endif %}" href="/dataset/">Dataset</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'conceptos' %}active{% endif %}" href="/conceptos/">Conceptos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'codo' %}active{% endif %}" href="/codo/">Método del Codo</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'ejecucion' %}active{% endif %}" href="/ejecucion/">Ejecución</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'clusters' %}active{% endif %}" href="/clusters/">Clústeres</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'centroides' %}active{% endif %}" href="/centroides/">Centroides</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'interpretacion' %}active{% endif %}" href="/interpretacion/">Interpretación</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    {% block content %}{% endblock %}
  </div>

  <footer class="text-center">
    <small>Minería de Datos &nbsp;·&nbsp; Diego Pinzón &nbsp;·&nbsp; Julián Gutiérrez &nbsp;·&nbsp; Felipe Segura</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
